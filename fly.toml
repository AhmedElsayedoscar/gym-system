# fly.toml app configuration file generated for gym-system on 2026-10-17T17:15:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gym-system'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = "gym_data"
  destination = "/app/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
