<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كارت العضوية</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="cardpage">
  <div class="card-header-bar">
    <div class="card-gym-title" id="gym-title">🏋️‍♂️ كارت العضوية الرقمي</div>
  </div>

  <div class="print-bar" id="actions-bar">
    <button class="btn primary btn-large" id="dl-img">💾 تحميل الكارنيه كصورة</button>
    <button class="btn btn-large" id="share-btn" style="display:none;">📤 مشاركة وحفظ</button>
    <button class="btn" id="print">🖨️ طباعة</button>
    
    <!-- أزرار تظهر للاستقبال فقط عند تسجيل الدخول -->
    <button class="btn whatsapp staff-only" id="wa-send" style="display:none;">💬 إرسال صورة الكارت عبر واتساب</button>
    <button class="btn staff-only" id="copy-img" style="display:none;">📋 نسخ الصورة (Ctrl+V)</button>
    <button class="btn staff-only" id="close" style="display:none;">لوحة التحكم</button>
  </div>

  <div class="card-wrapper">
    <div id="card">
      <div class="card-loading">جاري تحميل بيانات الكارت...</div>
    </div>
    <div class="card-mobile-hint">
      💡 يمكنك تحميل الكارت والاحتفاظ به على هاتفك، أو إبراز كود الـ QR عند مكتب الاستقبال لتسجيل حضورك في كل تمرين.
    </div>
  </div>

  <canvas id="cardCanvas" style="display:none;"></canvas>
  <script src="/common.js"></script>
  <script src="/card.js"></script>
</body>
</html>
